name: Append phalcon.phar to release

on:
  release:
    types:
      - created

permissions:
  contents: write

jobs:
  build:
    name: Compile and upload PHAR
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, zip, pdo
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Validate Box configuration
        run: vendor/bin/box validate

      - name: Compile phalcon.phar
        run: vendor/bin/box compile -v

      - name: Verify compiled PHAR
        run: test -f phalcon.phar

      - name: Smoke test compiled PHAR
        run: php phalcon.phar --version

      - name: Upload PHAR to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" phalcon.phar --clobber
