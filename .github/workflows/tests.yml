name: Tests

on:
  push:
  pull_request:

jobs:
  run-tests:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.2'
          - '8.3'
          - '8.4'

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: devtools
          MYSQL_USER: devtools
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: devtools
          POSTGRES_USER: devtools
          POSTGRES_PASSWORD: password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready -U devtools -d devtools"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, zip, pdo_mysql, pdo_pgsql
          coverage: xdebug
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Initialise databases
        env:
          MYSQL_DB_PORT: ${{ job.services.mysql.ports['3306'] }}
          MYSQL_DB_PASSWORD: root
          POSTGRES_DB_PORT: ${{ job.services.postgres.ports['5432'] }}
          PGPASSWORD: password
        run: bash tests/_ci/setup_dbs_github.sh

      - name: Install Phalcon DevTools command
        run: sudo ln -sf "$(pwd)/phalcon" /usr/local/bin/phalcon

      - name: Initialise WebTools
        env:
          MYSQL_DB_HOST: 127.0.0.1
          MYSQL_DB_USERNAME: devtools
          MYSQL_DB_PASSWORD: password
          MYSQL_DB_NAME: devtools
          MYSQL_DB_PORT: ${{ job.services.mysql.ports['3306'] }}

          POSTGRES_DB_HOST: 127.0.0.1
          POSTGRES_DB_USERNAME: devtools
          POSTGRES_DB_PASSWORD: password
          POSTGRES_DB_NAME: devtools
          POSTGRES_DB_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          rm -rf webtools
          phalcon project --name=webtools
          cd webtools
          composer install --prefer-dist --no-interaction --no-progress
          cd ..
          perl -0pi -e "s/'host'\s*=>\s*'[^']*'/'host'        => '127.0.0.1'/; s/'username'\s*=>\s*'[^']*'/'username'    => 'devtools'/; s/'password'\s*=>\s*'[^']*'/'password'    => 'password'/; s/'dbname'\s*=>\s*'[^']*'/'dbname'      => 'devtools'/" webtools/app/config/config.php
          perl -0pi -e "s/'charset'\s*=>\s*'utf8',/'charset'     => 'utf8',\n        'port'        => ${MYSQL_DB_PORT},/" webtools/app/config/config.php
          sed -i "s/database->charset/database->charset,\n                'port'     => \$config->database->port/g" webtools/app/config/services.php
          cd webtools
          phalcon webtools enable
          phalcon serve > /tmp/phalcon-webtools.log 2>&1 &
          cd ..
          for i in {1..30}; do if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/phalcon-webtools.log
          exit 1

      - name: Setup tests
        env:
          MYSQL_DB_PORT: ${{ job.services.mysql.ports['3306'] }}
          POSTGRES_DB_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          sed -i "s/CODECEPTION_URL=nginx/CODECEPTION_URL=127.0.0.1/; s/CODECEPTION_PORT=80/CODECEPTION_PORT=8000/; s/MYSQL_DB_HOST=mysql/MYSQL_DB_HOST=127.0.0.1/; s/MYSQL_DB_PORT=3306/MYSQL_DB_PORT=${MYSQL_DB_PORT}/" tests/.env.test
          echo "MYSQL_DB_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "MYSQL_DB_USERNAME=devtools" >> "$GITHUB_ENV"
          echo "MYSQL_DB_PASSWORD=password" >> "$GITHUB_ENV"
          echo "MYSQL_DB_NAME=devtools" >> "$GITHUB_ENV"
          echo "MYSQL_DB_PORT=${MYSQL_DB_PORT}" >> "$GITHUB_ENV"
          echo "POSTGRES_DB_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "POSTGRES_DB_USERNAME=devtools" >> "$GITHUB_ENV"
          echo "POSTGRES_DB_PASSWORD=password" >> "$GITHUB_ENV"
          echo "POSTGRES_DB_NAME=devtools" >> "$GITHUB_ENV"
          echo "POSTGRES_DB_PORT=${POSTGRES_DB_PORT}" >> "$GITHUB_ENV"
          mkdir -p .phalcon
          vendor/bin/codecept build
          vendor/bin/phpcs

      - name: Run MySQL acceptance tests
        run: vendor/bin/codecept run --ext DotReporter acceptance -g mysql --env mysql

      - name: Run PostgreSQL acceptance tests
        run: vendor/bin/codecept run --ext DotReporter acceptance -g pgsql --env pgsql

      - name: Run common acceptance tests
        run: vendor/bin/codecept run --ext DotReporter acceptance -g common --coverage-xml=coverage-common-${{ matrix.php-version }}.xml

      - name: Run unit tests
        run: vendor/bin/codecept run --ext DotReporter unit --coverage-xml=coverage-unit-${{ matrix.php-version }}.xml

      - name: Run functional tests
        run: vendor/bin/codecept run --ext DotReporter functional --coverage-xml=coverage-functional-${{ matrix.php-version }}.xml

      - name: Run console tests
        run: vendor/bin/codecept run --ext DotReporter console --coverage-xml=coverage-console-${{ matrix.php-version }}.xml

      - name: PHPStan
        run: vendor/bin/phpstan analyse

      - name: Psalm
        run: vendor/bin/psalm --threads=1

      - name: Debug failed build
        if: failure()
        run: |
          echo "=== WebTools config ==="
          cat webtools/app/config/config.php || true
          echo "=== WebTools services ==="
          cat webtools/app/config/services.php || true
          echo "=== WebTools server ==="
          cat /tmp/phalcon-webtools.log || true
          echo "=== PHP ==="
          php -v
          echo "=== Composer packages ==="
          composer show -D || true

      - name: Upload Codeception logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: codeception-logs-php-${{ matrix.php-version }}
          path: tests/_output
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./tests/_output/coverage-common-${{ matrix.php-version }}.xml,./tests/_output/coverage-unit-${{ matrix.php-version }}.xml,./tests/_output/coverage-functional-${{ matrix.php-version }}.xml,./tests/_output/coverage-console-${{ matrix.php-version }}.xml
